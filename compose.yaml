# Local development stack: gateway, mock provider, and Redis for admission control.
# Requires GATEWAY_API_KEYS in the shell or in .env (see .env.example).
#
#   docker compose up --build                  one gateway on 127.0.0.1:8000
#   docker compose --profile multi up --build  a second gateway on 127.0.0.1:8001
#   docker compose --profile agent up --build  the agent runtime on 127.0.0.1:8100
#                                              (needs AGENT_API_KEYS and AGENT_GATEWAY_API_KEY)
#
# Redis is reachable only on the internal backend network. Its data is not
# persisted, so limits reset when the container restarts.

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]

x-gateway: &gateway
  <<: *hardening
  build:
    context: .
    target: runtime
  environment:
    GATEWAY_ENVIRONMENT: development
    GATEWAY_API_KEYS: ${GATEWAY_API_KEYS:?set GATEWAY_API_KEYS in the shell or .env}
    # Optional; without it GET /metrics refuses every request.
    GATEWAY_METRICS_API_KEYS: ${GATEWAY_METRICS_API_KEYS:-}
    GATEWAY_LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-INFO}
    GATEWAY_REDIS_URL: redis://redis:6379/0
    GATEWAY_DATABASE_URL: postgresql+asyncpg://gateway:gateway-local-only@postgres:5432/gateway
    # The mock only checks that a key is present; this is not a real credential.
    MOCK_UPSTREAM_API_KEY: mock-upstream-key
  volumes:
    - ./config/gateway.compose.toml:/etc/gateway/gateway.toml:ro
  networks: [frontend, backend, agent]
  depends_on:
    mock-upstream:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  stop_grace_period: 35s

services:
  gateway:
    <<: *gateway
    ports:
      - "127.0.0.1:8000:8000"

  gateway-2:
    <<: *gateway
    profiles: [multi]
    ports:
      - "127.0.0.1:8001:8000"

  # The agent runtime (docs/agent-runtime.md). AGENT_GATEWAY_API_KEY must be one of
  # GATEWAY_API_KEYS. The variables default to empty so that other profiles work
  # without them; the runtime refuses to start if they are missing. Its only
  # network is shared with the gateways alone, so it cannot reach the mock
  # provider, Redis, or PostgreSQL directly.
  agent-runtime:
    <<: *hardening
    profiles: [agent]
    build:
      context: .
      target: agent-runtime
    environment:
      AGENT_ENVIRONMENT: development
      AGENT_API_KEYS: ${AGENT_API_KEYS:-}
      AGENT_GATEWAY_URL: http://gateway:8000
      AGENT_GATEWAY_API_KEY: ${AGENT_GATEWAY_API_KEY:-}
      AGENT_PLANNER_MODEL: agent-planner
      AGENT_DIAGNOSIS_MODEL: agent-diagnosis
      AGENT_LOG_LEVEL: ${AGENT_LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8100:8100"
    networks: [agent]
    depends_on:
      gateway:
        condition: service_healthy
    stop_grace_period: 35s

  mock-upstream:
    <<: *hardening
    build:
      context: .
      target: mock-upstream
    environment:
      MOCK_RESPONSE_DELAY_SECONDS: ${MOCK_RESPONSE_DELAY_SECONDS:-0}
      MOCK_STREAM_DELAY_SECONDS: ${MOCK_STREAM_DELAY_SECONDS:-0.05}
    # Published on localhost only, so load tests can measure a baseline without the
    # gateway and read the mock's concurrency statistics.
    ports:
      - "127.0.0.1:9000:9000"
    networks: [frontend, backend]

  redis:
    <<: *hardening
    image: redis:8.10.3-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [backend]
    stop_grace_period: 10s

  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway-local-only
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  migrate:
    build:
      context: .
      target: runtime
    environment:
      GATEWAY_DATABASE_URL: postgresql+asyncpg://gateway:gateway-local-only@postgres:5432/gateway
    command: ["alembic", "upgrade", "head"]
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy

networks:
  frontend: {}
  backend:
    internal: true
  # The agent runtime and the gateways. Not internal, because the runtime's port is
  # published to the host; outbound traffic from it is therefore not blocked.
  agent: {}

volumes:
  postgres-data: {}
