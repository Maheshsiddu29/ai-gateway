# Configuration for compose.yaml: the mock provider, with admission control backed
# by the Redis service. The same file serves every gateway instance in the stack.

[providers.mock-openai]
type = "openai_compatible"
base_url = "http://mock-upstream:9000/v1"
api_key_env = "MOCK_UPSTREAM_API_KEY"

[providers.mock-anthropic]
type = "anthropic"
base_url = "http://mock-upstream:9000"
api_key_env = "MOCK_UPSTREAM_API_KEY"

[models.fast]
provider = "mock-openai"
model = "mock-small"
max_output_tokens = 1024
fallbacks = [{ provider = "mock-anthropic", model = "mock-small" }]

[models.balanced]
provider = "mock-anthropic"
model = "mock-medium"
default_max_tokens = 512
max_output_tokens = 2048

[models.quality]
provider = "mock-anthropic"
model = "mock-large"
default_max_tokens = 2048
max_output_tokens = 4096

# Routed aliases. "routed" picks the cheaper of two mock models by mock price.
# "routed-quality" requires recorded evaluation evidence, which a fresh stack does
# not have, so it uses its primary until runs are recorded.
[models.routed]
provider = "mock-anthropic"
model = "mock-large"
max_output_tokens = 1024

[models.routed.routing]
policy = "lowest_cost"
candidates = [{ provider = "mock-openai", model = "mock-routed-small" }]

[models.routed-quality]
provider = "mock-anthropic"
model = "mock-large"
max_output_tokens = 1024

[models.routed-quality.routing]
policy = "quality_constrained"
candidates = [{ provider = "mock-openai", model = "mock-routed-small" }]
dataset = "support-ticket-category"
dataset_version = "1"
min_success_rate = 0.9
min_samples = 40
max_evidence_age_days = 30

[resilience]
request_deadline_seconds = 120

[admission]
enabled = true

# Generous enough for local load tests to measure gateway overhead; lower them to
# watch limits being enforced.
[admission.default_limits]
requests_per_minute = 6000
request_burst = 1000
tokens_per_minute = 6000000
token_burst = 1000000
max_concurrent_requests = 64

[cost]
enabled = true

[cost.default_key_limits]
daily_micro_usd = 1000000
monthly_micro_usd = 10000000

[[cost.pricing]]
provider = "mock-openai"
model = "mock-small"
version = "mock-2026-10"
effective_at = 2020-01-01T00:00:00Z
input_per_million_usd = "1.00"
output_per_million_usd = "2.00"

[[cost.pricing]]
provider = "mock-anthropic"
model = "mock-small"
version = "mock-2026-10"
effective_at = 2020-01-01T00:00:00Z
input_per_million_usd = "1.00"
output_per_million_usd = "2.00"

[[cost.pricing]]
provider = "mock-anthropic"
model = "mock-medium"
version = "mock-2026-10"
effective_at = 2020-01-01T00:00:00Z
input_per_million_usd = "1.00"
output_per_million_usd = "2.00"

[[cost.pricing]]
provider = "mock-anthropic"
model = "mock-large"
version = "mock-2026-10"
effective_at = 2020-01-01T00:00:00Z
input_per_million_usd = "1.00"
output_per_million_usd = "2.00"

[[cost.pricing]]
provider = "mock-openai"
model = "mock-routed-small"
version = "mock-2026-10"
effective_at = 2020-01-01T00:00:00Z
input_per_million_usd = "0.50"
output_per_million_usd = "1.00"

# Capability registry for routed targets. The limits are made up for the mock
# provider; for real models, take them from the vendor's documentation.
[routing]
enabled = true

[[routing.models]]
provider = "mock-anthropic"
model = "mock-large"
context_window_tokens = 8192
max_output_tokens = 4096
capabilities = ["streaming", "stream_usage", "stop"]

[[routing.models]]
provider = "mock-openai"
model = "mock-routed-small"
context_window_tokens = 8192
max_output_tokens = 1024
capabilities = ["streaming", "stream_usage", "stop"]
