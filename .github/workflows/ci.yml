name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.6"

jobs:
  checks:
    name: Lint, types, and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_DB: gateway_test
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install dependencies from the lockfile
        run: uv sync --locked
      - name: Install Redis for the admission-control integration tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends redis-server openssl
          redis-server --version | grep -E "v=7\.0\."
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: Unit tests
        run: uv run pytest tests/unit
      - name: Agent runtime types and tests
        working-directory: services/agent_runtime
        run: |
          uv run mypy
          uv run pytest
      - name: Migrate test database, including a downgrade round trip
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
        env:
          GATEWAY_DATABASE_URL: postgresql+asyncpg://gateway:gateway-test-only@127.0.0.1:5432/gateway_test
      - name: Integration tests
        run: uv run pytest tests/integration
        env:
          # Fail instead of skipping when redis-server is missing.
          GATEWAY_REQUIRE_REDIS_TESTS: "1"
          GATEWAY_TEST_DATABASE_URL: postgresql+asyncpg://gateway:gateway-test-only@127.0.0.1:5432/gateway_test

  package:
    name: Package build and Compose smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Build sdist and wheel
        run: |
          uv build
          uv build --package agent-runtime --out-dir dist/agent-runtime
      - name: Install the wheels into clean environments and import them
        run: |
          uv venv --python 3.13 /tmp/wheel-check
          uv pip install --python /tmp/wheel-check dist/*.whl
          /tmp/wheel-check/bin/python -c "import gateway.main"
          uv venv --python 3.13 /tmp/agent-wheel-check
          uv pip install --python /tmp/agent-wheel-check dist/agent-runtime/*.whl
          /tmp/agent-wheel-check/bin/python -c "import agent_runtime.main"
      - name: Build the container images
        run: |
          docker build --target runtime --tag ai-gateway:ci .
          docker build --target mock-upstream --tag ai-gateway-mock:ci .
          docker build --target agent-runtime --tag ai-gateway-agent:ci .
      - name: Validate the Compose configuration
        env:
          GATEWAY_API_KEYS: ci-placeholder-key
        run: |
          docker compose config --quiet
          docker compose --profile multi config --quiet
          docker compose --profile agent config --quiet
      - name: Start the Compose stack and run the smoke tests
        env:
          GATEWAY_API_KEYS: ci-smoke-gateway-key
          GATEWAY_METRICS_API_KEYS: ci-smoke-metrics-key
          AGENT_API_KEYS: ci-smoke-agent-key
          AGENT_GATEWAY_API_KEY: ci-smoke-gateway-key
        run: |
          docker compose --profile agent up --build --wait --wait-timeout 180
          tools/smoke_compose.sh
          tools/smoke_agent.sh
      - name: Show logs and remove the Compose stack
        if: always()
        env:
          GATEWAY_API_KEYS: ci-smoke-gateway-key
        run: |
          docker compose --profile agent logs --no-color gateway agent-runtime | tail -n 100
          docker compose --profile agent down -v

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Audit runtime dependencies for known vulnerabilities
        run: |
          uv export --locked --no-dev --all-packages --no-emit-workspace --format requirements-txt -o /tmp/requirements.txt
          uvx --from pip-audit==2.10.1 pip-audit --strict --require-hashes --disable-pip -r /tmp/requirements.txt
      - name: Scan the repository history for secrets
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --no-banner
